<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/assets/icons/icon48.png" />
    <title>Chia sẻ bài viết - AutoPost Pro</title>
    <meta name="description" content="Chia sẻ bài viết từ Fanpage Facebook tự động lên hàng loạt hội nhóm với AutoPost Pro." />

    <!-- Legacy iOS Polyfills & Runtime Shims (must load first) -->
    <script src="/ios-polyfill.js"></script>
    <script>
        try {
            var savedTheme = window.localStorage.getItem('theme');
            if (savedTheme) {
                try { savedTheme = JSON.parse(savedTheme); } catch (e) {}
            }
            var prefersDark = false;
            try {
                prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            } catch (e) {}
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        } catch (e) {}
        window.__AUTOPOST_INITIAL_PAGE__ = 'share';
    </script>

    <!-- Pre-compiled Legacy-iOS-Safe Tailwind CSS & Custom Styles -->
    <link rel="stylesheet" href="/tw-legacy.css" />
    <link rel="stylesheet" href="/style.css" />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />

    <!-- React 18.2.0 Production UMD (Zero runtime Babel transpilation) -->
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Firebase v8.10.1 ES5 SDKs (100% compatible with iOS 10-18 Safari) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- Google Identity Services (for Google Sign-In) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- ES5 Error Handler -->
    <script>
        window.onerror = function (msg, url, lineNo) {
            if (!msg || msg === 'Script error.' || msg === 'Script error') return false;
            if (url && url.indexOf(window.location.origin) === -1) return false;
            try {
                var errorDiv = document.createElement('div');
                errorDiv.style.position = 'fixed';
                errorDiv.style.top = '0';
                errorDiv.style.left = '0';
                errorDiv.style.width = '100%';
                errorDiv.style.background = '#fee2e2';
                errorDiv.style.color = '#b91c1c';
                errorDiv.style.padding = '16px';
                errorDiv.style.zIndex = '9999';
                errorDiv.style.fontFamily = 'monospace';
                errorDiv.style.fontSize = '13px';
                errorDiv.textContent = 'Error: ' + msg + ' (Line ' + lineNo + ')';
                if (document.body) document.body.appendChild(errorDiv);
            } catch (e) {}
            return false;
        };
    </script>
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-text-main antialiased transition-colors duration-300">
    <!-- React Root -->
    <div id="root"></div>

    <!-- Pre-compiled AutoPost Pro Application (ES2015 / Safari 11+ compatible) -->
    <script src="/app.bundle.js"></script>
</body>

</html>
