            font-family: 'Material Symbols Outlined';

            background-color: #0b1326;

        }

            background: linear-gradient(135deg, rgba(30, 41, 59, 0.4) 0%, rgba(11, 19, 38, 0.8) 100%);

<body class="flex h-[100dvh] overflow-hidden bg-background font-body-md text-on-surface">

    <div id="root" class="flex w-full h-full overflow-hidden"></div>

    <!-- React and Babel Libs -->
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.0/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo, useRef } = React;

        let rtdb = null;
        let auth = null;

        // Bootstrapped Admin UIDs & Emails (for Firebase mode)
        const ADMIN_UIDS = [
            "112937746933560753066",
            "113264177727144211176"
        ];
        const ADMIN_EMAILS = [
            "hungboa5075@gmail.com"
        ];

        function App() {
            const [adminUser, setAdminUser] = useState(null);
            const [useFirebaseMode, setUseFirebaseMode] = useState(false);
            const [firebaseReady, setFirebaseReady] = useState(false);
            const [showDomainHelper, setShowDomainHelper] = useState(false);
            const [copiedDomain, setCopiedDomain] = useState(false);
            const [users, setUsers] = useState([]);
            const [tab, setTab] = useState('pending');
            const [search, setSearch] = useState('');
            const [filterPlan, setFilterPlan] = useState('all');
            const [filterStatus, setFilterStatus] = useState('all');
            const [loading, setLoading] = useState(false);
            const [editModal, setEditModal] = useState(null);
            const [toast, setToast] = useState(null);
            const toastTimerRef = useRef(null);
            const [settings, setSettings] = useState({
                appName: 'AutoPost Pro',
                logoUrl: '',
                bankName: 'mbbank',
                bankNo: '',
                bankUser: '',
                qrTemplate: ''
            });

            const [showAdminDropdown, setShowAdminDropdown] = useState(false);
            const [showMobileSidebar, setShowMobileSidebar] = useState(false);
            const dropdownRef = useRef(null);

            useEffect(() => {
                function handleClickOutside(event) {
                    if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
                        setShowAdminDropdown(false);
                    }
                }
                document.addEventListener("mousedown", handleClickOutside);
                return () => {
                    document.removeEventListener("mousedown", handleClickOutside);
                };
            }, [dropdownRef]);

            const showToast = (msg, type = 'success') => {
                if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                setToast({ msg, type });
                toastTimerRef.current = setTimeout(() => setToast(null), 3200);
            };

            // Dynamic Title Synchronization
            useEffect(() => {
                if (settings.appName) {
                    document.title = `Quản trị - ${settings.appName}`;
                }
            }, [settings.appName]);

            // Bootstrap optional Firebase config & restore local admin session
            useEffect(() => {
                let unsub = null;
                let cancelled = false;

                const init = async () => {
                    // Check ?autostart=1 or cached local admin session
                    const params = new URLSearchParams(window.location.search);
                    const savedLocalAdmin = localStorage.getItem('autopost_local_admin');
                    if (params.get('autostart') === '1' || savedLocalAdmin === 'true') {
                        setAdminUser({
                            uid: 'demo-admin-01',
                            displayName: 'Quản trị viên AutoPost',
                            email: 'admin@autopost.local',
                            photoURL: 'https://ui-avatars.com/api/?name=Admin+Pro&background=2563eb&color=ffffff',
                            isLocal: true
                        });
                    }

                    const DEFAULT_FIREBASE_CONFIG = {
                        apiKey: "AIzaSyCvxzc0u0lxvY5JxEIWKOp59pAGb78ocdA",
                        authDomain: "autopost-8f16e.firebaseapp.com",
                        databaseURL: "https://autopost-8f16e-default-rtdb.firebaseio.com",
                        projectId: "autopost-8f16e",
                        storageBucket: "autopost-8f16e.firebasestorage.app",
                        messagingSenderId: "213973905650",
                        appId: "1:213973905650:web:4875b21b380eda1a2de06b"
                    };

                    try {
                        let activeConfig = DEFAULT_FIREBASE_CONFIG;
                        const res = await fetch('/api/firebase-config').catch(() => null);
                        if (res && res.ok) {
                            const data = await res.json();
                            if (data.configured && data.config) {
                                activeConfig = data.config;
                            } else if (data.configured === false) {
                                activeConfig = null;
                            }
                        }

                        if (!cancelled && activeConfig && typeof firebase !== 'undefined') {
                            if (!firebase.apps.length) firebase.initializeApp(activeConfig);
                            rtdb = firebase.database();
                            auth = firebase.auth();
                            setUseFirebaseMode(true);
                            unsub = auth.onAuthStateChanged(user => {
                                if (user) {
                                    setLoading(true);
                                    rtdb.ref('users/' + user.uid).once('value').then(snapshot => {
                                        const val = snapshot.val();
                                        const isHardcodedAdmin = ADMIN_UIDS.includes(user.uid) ||
                                            user.providerData.some(p => ADMIN_UIDS.includes(p.uid)) ||
                                            (user.email && ADMIN_EMAILS.includes(user.email.toLowerCase()));

                                        if ((val && val.role === 'admin') || isHardcodedAdmin) {
                                            if (isHardcodedAdmin && (!val || val.role !== 'admin')) {
                                                rtdb.ref('users/' + user.uid + '/role').set('admin').catch(() => {});
                                            }
                                            setAdminUser(user);
                                        } else {
                                            showToast('⚠️ Tài khoản của bạn không có quyền truy cập trang quản trị!', 'error');
                                            auth.signOut();
                                            setAdminUser(null);
                                        }
                                        setLoading(false);
                                    }).catch(err => {
                                        console.error(err);
                                        showToast('Lỗi kiểm tra quyền hạn cơ sở dữ liệu!', 'error');
                                        setLoading(false);
                                    });
                                }
                            });
                        }
                    } catch (err) {
                        console.warn('Firebase config check skipped:', err);
                    } finally {
                        if (!cancelled) setFirebaseReady(true);
                    }
                };

                init();
                return () => {
                    cancelled = true;
                    if (typeof unsub === 'function') unsub();
                };
            }, []);

            // Google login handler
            const handleCopyCurrentDomain = () => {
                const host = window.location.hostname || window.location.host;
                const done = () => {
                    setCopiedDomain(true);
                    showToast('✅ Đã sao chép tên miền: ' + host, 'success');
                    setTimeout(() => setCopiedDomain(false), 2000);
                };
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(host).then(done).catch(() => {
                        const ta = document.createElement('textarea');
                        ta.value = host;
                        ta.style.position = 'fixed';
                        ta.style.opacity = '0';
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        document.body.removeChild(ta);
                        done();
                    });
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = host;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    done();
                }
            };

            const handleLogin = async () => {
                if (!auth) {
                    showToast('Firebase Google Auth chưa cấu hình — Hãy dùng nút "Vào Quản trị (Local / Demo)" bên dưới!', 'error');
                    return;
                }
                try {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    await auth.signInWithPopup(provider);
                } catch (e) {
                    if (e.code === 'auth/unauthorized-domain') {
                        setShowDomainHelper(true);
                        showToast('⚠️ Tên miền chưa được cấp quyền trong Firebase autopost-8f16e — hãy sao chép tên miền bên dưới!', 'error');
                    } else {
                        showToast('❌ Lỗi đăng nhập Google: ' + (e.message || e.code), 'error');
                    }
                }
            };

            const handleLocalAdminLogin = () => {
                localStorage.setItem('autopost_local_admin', 'true');
                setAdminUser({
                    uid: 'demo-admin-01',
                    displayName: 'Quản trị viên AutoPost',
                    email: 'admin@autopost.local',
                    photoURL: 'https://ui-avatars.com/api/?name=Admin+Pro&background=2563eb&color=ffffff',
                    isLocal: true
                });
                showToast('✅ Đã đăng nhập bảng quản trị cục bộ!', 'success');
            };

            const handleSignOut = () => {
                localStorage.removeItem('autopost_local_admin');
                if (auth && !adminUser?.isLocal) {
                    auth.signOut().catch(() => {});
                }
                setAdminUser(null);
                setShowAdminDropdown(false);
            };

            // Fetch helper for local server API
            const refreshLocalData = useCallback(async () => {
                try {
                    const [uRes, sRes] = await Promise.all([
                        fetch('/api/admin/users'),
                        fetch('/api/settings')
                    ]);
                    if (uRes.ok) {
                        const list = await uRes.json();
                        setUsers(Array.isArray(list) ? list : []);
                    }
                    if (sRes.ok) {
                        const val = await sRes.json();
                        if (val) {
                            setSettings({
                                appName: val.appName || 'AutoPost Pro',
                                logoUrl: val.logoUrl || '',
                                bankName: val.bankName || 'mbbank',
                                bankNo: val.bankNo || '',
                                bankUser: val.bankUser || '',
                                qrTemplate: val.qrTemplate || ''
                            });
                        }
                    }
                } catch (err) {
                    console.error(err);
                    showToast('Lỗi tải dữ liệu máy chủ!', 'error');
                } finally {
                    setLoading(false);
                }
            }, []);

            // System Settings & Users Listener
            useEffect(() => {
                if (!adminUser) return;

                if (useFirebaseMode && rtdb && !adminUser.isLocal) {
                    const settingsRef = rtdb.ref('settings');
                    const onSettingsVal = settingsRef.on('value', snapshot => {
                        const val = snapshot.val();
                        if (val) {
                            setSettings({
                                appName: val.appName || 'AutoPost Pro',
                                logoUrl: val.logoUrl || '',
                                bankName: val.bankName || 'mbbank',
                                bankNo: val.bankNo || '',
                                bankUser: val.bankUser || '',
                                qrTemplate: val.qrTemplate || ''
                            });
                        }
                    });

                    setLoading(true);
                    const usersRef = rtdb.ref('users');
                    const onValue = usersRef.on('value', snapshot => {
                        const data = snapshot.val() || {};
                        const list = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                        setUsers(list);
                        setLoading(false);
                    }, err => {
                        console.error(err);
                        showToast('Lỗi kết nối Realtime Database!', 'error');
                        setLoading(false);
                    });

                    return () => {
                        settingsRef.off('value', onSettingsVal);
                        usersRef.off('value', onValue);
                    };
                } else {
                    setLoading(true);
                    refreshLocalData();
                }
            }, [adminUser, useFirebaseMode, refreshLocalData]);

            // Computed Stats
            const stats = useMemo(() => {
                let total = users.length;
                let pending = 0;
                let active = 0;
                let revenue = 0;

                users.forEach(u => {
                    const sub = u.subscription || {};
                    if (sub.status === 'pending') pending++;
                    if (sub.status === 'active') active++;
                    
                    (sub.history || []).forEach(h => {
                        if (h.status === 'approved') {
                            revenue += (h.amount || 0);
                        }
                    });
                });

                return { total, pending, active, revenue };
            }, [users]);

            // Filter logic
            const filtered = useMemo(() => {
                return users.filter(u => {
                    const sub = u.subscription || {};
                    
                    // Tab-level segregation
                    if (tab === 'pending' && sub.status !== 'pending') return false;
                    if (tab === 'active' && sub.status !== 'active') return false;

                    // Plan selection
                    if (filterPlan !== 'all' && (sub.plan || 'free') !== filterPlan) return false;

                    // Custom status search
                    if (tab === 'all' && filterStatus !== 'all' && (sub.status || 'active') !== filterStatus) return false;

                    // Keyword query
                    const term = search.toLowerCase();
                    const name = (u.name || '').toLowerCase();
                    const email = (u.email || '').toLowerCase();
                    return name.includes(term) || email.includes(term) || u.id.toLowerCase().includes(term);
                }).sort((a, b) => {
                    // Show pending ones first
                    const aPend = a.subscription?.status === 'pending' ? 1 : 0;
                    const bPend = b.subscription?.status === 'pending' ? 1 : 0;
                    return bPend - aPend;
                });
            }, [users, tab, search, filterPlan, filterStatus]);

            // Subscription approval
            const handleApprove = async (userId) => {
                const user = users.find(u => u.id === userId);
                if (!user) return;

                if (useFirebaseMode && rtdb && !adminUser?.isLocal) {
                    const sub = user.subscription || {};
                    const now = new Date();
                    const baseDate = sub.expiresAt && new Date(sub.expiresAt) > now ? new Date(sub.expiresAt) : new Date(now);
                    const requestedPlan = sub.pendingPlan || 'pro';
                    const requestedMonths = Math.max(1, parseInt(sub.pendingMonths || 1, 10) || 1);

                    baseDate.setMonth(baseDate.getMonth() + requestedMonths);

                    const updatedHistory = (sub.history || []).map(h => {
                        if (h.status === 'pending') {
                            return { ...h, status: 'approved', date: now.toISOString() };
                        }
                        return h;
                    });

                    const updatedSub = {
                        ...sub,
                        plan: requestedPlan,
                        status: 'active',
                        expiresAt: baseDate.toISOString(),
                        pendingPlan: null,
                        pendingMonths: null,
                        history: updatedHistory
                    };

                    await rtdb.ref('users/' + userId + '/subscription').set(updatedSub);
                } else {
                    const res = await fetch(`/api/admin/users/${encodeURIComponent(userId)}/approve`, { method: 'POST' });
                    if (!res.ok) return showToast('❌ Lỗi duyệt yêu cầu!', 'error');
                    await refreshLocalData();
                }
                showToast('🚀 Đã duyệt nâng cấp gói thành công!', 'success');
            };

            // Subscription rejection
            const handleReject = async (userId) => {
                const user = users.find(u => u.id === userId);
                if (!user) return;

                if (useFirebaseMode && rtdb && !adminUser?.isLocal) {
                    const sub = user.subscription || {};
                    const now = new Date();

                    const updatedHistory = (sub.history || []).map(h => {
                        if (h.status === 'pending') {
                            return { ...h, status: 'rejected', date: now.toISOString() };
                        }
                        return h;
                    });

                    const updatedSub = {
                        ...sub,
                        status: 'active',
                        pendingPlan: null,
                        pendingMonths: null,
                        history: updatedHistory
                    };

                    await rtdb.ref('users/' + userId + '/subscription').set(updatedSub);
                } else {
                    const res = await fetch(`/api/admin/users/${encodeURIComponent(userId)}/reject`, { method: 'POST' });
                    if (!res.ok) return showToast('❌ Lỗi từ chối yêu cầu!', 'error');
                    await refreshLocalData();
                }
                showToast('❌ Đã từ chối nâng cấp gói dịch vụ!');
            };

            // Edit Modal Handler (safe integer clamping prevents NaN / Invalid Date)
            const handleEditSave = async (userId, plan, months, status, role) => {
                const user = users.find(u => u.id === userId);
                if (!user) return;
                const safeMonths = Math.max(1, Math.min(36, parseInt(months, 10) || 1));

                if (useFirebaseMode && rtdb && !adminUser?.isLocal) {
                    const now = new Date();
                    let expiresAt = null;
                    if (plan !== 'free' && safeMonths > 0) {
                        const exp = new Date(now);
                        exp.setMonth(exp.getMonth() + safeMonths);
                        expiresAt = exp.toISOString();
                    }
                    const historyEntry = {
                        id: Date.now(),
                        plan, months: safeMonths,
                        date: now.toISOString(),
                        status: status === 'active' ? 'approved' : status,
                        amount: plan === 'pro' ? safeMonths * 199000 : plan === 'enterprise' ? safeMonths * 499000 : 0,
                        note: 'Admin edited'
                    };
                    const sub = {
                        ...(user.subscription || {}),
                        plan, status, expiresAt,
                        pendingPlan: null,
                        pendingMonths: null,
                        history: [historyEntry, ...(user.subscription?.history || [])]
                    };

                    await rtdb.ref('users/' + userId + '/subscription').set(sub);
                    await rtdb.ref('users/' + userId + '/role').set(role);
                } else {
                    const res = await fetch(`/api/admin/users/${encodeURIComponent(userId)}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ plan, months: safeMonths, status, role })
                    });
                    if (!res.ok) return showToast('❌ Lỗi cập nhật người dùng!', 'error');
                    await refreshLocalData();
                }

                setEditModal(null);
                showToast('💾 Đã cập nhật người dùng thành công!', 'success');
            };

            // System settings update
            const handleSaveSettings = async (e) => {
                e.preventDefault();
                try {
                    if (useFirebaseMode && rtdb && !adminUser?.isLocal) {
                        await rtdb.ref('settings').set(settings);
                    } else {
                        const res = await fetch('/api/settings', {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(settings)
                        });
                        if (!res.ok) throw new Error('Không thể lưu cấu hình lên máy chủ');
                    }

                                                                            </td>
                                                                            <td className="px-6 py-4 text-xs font-bold text-slate-300">{latest?.months ? latest.months + ' tháng' : '—'}</td>
                                                                            <td className="px-6 py-4 text-xs font-bold text-emerald-400">{latest?.amount ? latest.amount.toLocaleString('vi-VN') + 'đ' : '—'}</td>
                                                                            <td className="px-6 py-4 text-[10px] text-slate-500 font-mono">{latest?.date ? new Date(latest.date).toLocaleString('vi-VN') : '—'}</td>
                                                                            <td className="px-6 py-4 text-right">
                                                                                <div className="flex items-center justify-end gap-2">
                                                                                    {sub.status === 'pending' && (
                                                                                        <>
                                                                                            <button onClick={() => handleApprove(u.id)} className="flex items-center gap-1 px-3 py-1.5 bg-emerald-500/15 hover:bg-emerald-500 text-emerald-400 hover:text-white rounded-xl text-xs font-bold transition-all shadow-sm">
                                                                                                <span className="material-symbols-outlined text-xs font-black">check</span> Duyệt
                                                                                            </button>
                                                                                            <button onClick={() => handleReject(u.id)} className="flex items-center gap-1 px-3 py-1.5 bg-rose-500/15 hover:bg-rose-500 text-rose-400 hover:text-white rounded-xl text-xs font-bold transition-all shadow-sm">
                                                                                                <span className="material-symbols-outlined text-xs font-black">close</span> Hủy
                                                                                            </button>
                                                                                        </>
                                                                                    )}
                                                                                    <button onClick={() => setEditModal({ userId: u.id, plan: sub.plan || 'free', months: latest?.months || 1, status: sub.status || 'active', role: u.role || 'user' })} className="flex items-center gap-1 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold transition-all border border-slate-700">
                                                                                        <span className="material-symbols-outlined text-xs">edit</span> Sửa
                                                                                    </button>
                                                                                </div>
                                                                            </td>
                                                                        </tr>
                                                                    );
                                                                })}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>

                    {/* Edit User Subscription Modal */}
                    {editModal && (
                        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
                            <div className="absolute inset-0 bg-slate-950/70 backdrop-blur-sm" onClick={() => setEditModal(null)}></div>
                            <div className="relative w-full max-w-md max-h-[90dvh] overflow-y-auto bg-slate-900 border border-slate-800 rounded-t-3xl sm:rounded-3xl p-5 sm:p-6 shadow-2xl animate-slide-in">
                                <div className="flex justify-between items-center mb-5">
                                    <h2 className="text-lg font-black text-white flex items-center gap-2">
                                        <span className="material-symbols-outlined text-primary">edit_note</span> Chỉnh sửa gói thành viên
                                    </h2>
                                    <button onClick={() => setEditModal(null)} className="min-w-[36px] min-h-[36px] flex items-center justify-center hover:bg-slate-800 rounded-full transition-colors">
                                        <span className="material-symbols-outlined text-base">close</span>
                                    </button>
                                </div>

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wider">Cấp độ gói</label>
                                        <select className="w-full bg-slate-950 border border-slate-850 rounded-xl px-4 py-3 text-sm text-slate-200 outline-none focus:border-primary transition-all cursor-pointer" value={editModal.plan} onChange={e => setEditModal({...editModal, plan: e.target.value})}>
                                            <option value="free">Free (Miễn phí)</option>
                                            <option value="pro">Pro - 199.000đ/tháng</option>
                                            <option value="enterprise">Enterprise - 499.000đ/tháng</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wider">Số tháng gia hạn</label>
                                        <input type="number" min="1" max="36" className="w-full bg-slate-950 border border-slate-850 rounded-xl px-4 py-3 text-sm text-slate-200 outline-none focus:border-primary transition-all" value={editModal.months} onChange={e => setEditModal({...editModal, months: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wider">Trạng thái kích hoạt</label>
                                        <select className="w-full bg-slate-950 border border-slate-850 rounded-xl px-4 py-3 text-sm text-slate-200 outline-none focus:border-primary transition-all cursor-pointer" value={editModal.status} onChange={e => setEditModal({...editModal, status: e.target.value})}>
                                            <option value="active">Hoạt động (Active)</option>
                                            <option value="pending">Đang đợi duyệt (Pending)</option>
                                            <option value="expired">Hết hạn sử dụng (Expired)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wider">Phân quyền vai trò</label>
                                        <select className="w-full bg-slate-950 border border-slate-850 rounded-xl px-4 py-3 text-sm text-slate-200 outline-none focus:border-primary transition-all cursor-pointer" value={editModal.role || 'user'} onChange={e => setEditModal({...editModal, role: e.target.value})}>
                                            <option value="user">USER (Thành viên)</option>
                                            <option value="admin">ADMIN (Quản trị viên)</option>
                                        </select>
                                    </div>
                                </div>

                                <div className="flex gap-3 mt-6 pt-5 border-t border-slate-800/85">
                                    <button className="flex-1 min-h-[44px] py-3 bg-slate-800 hover:bg-slate-700 text-slate-350 font-bold rounded-xl text-xs transition-all" onClick={() => setEditModal(null)}>Hủy bỏ</button>
                                    <button className="flex-1 min-h-[44px] py-3 bg-primary hover:bg-opacity-90 text-slate-950 font-black rounded-xl text-xs shadow-lg transition-all" onClick={() => handleEditSave(editModal.userId, editModal.plan, editModal.months, editModal.status, editModal.role || 'user')}>Lưu thay đổi</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Sliding Dynamic Toast */}
                    {toast && (
                        <div className={`fixed bottom-4 left-4 right-4 sm:left-auto sm:right-6 sm:max-w-sm z-50 px-4 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3 transition-all duration-300 border animate-slide-in ${toast.type === 'error' ? 'bg-rose-500/10 border-rose-500/30 text-rose-400' : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400'}`}>
                            <span className="material-symbols-outlined text-lg flex-shrink-0">
                                {toast.type === 'error' ? 'report' : 'verified'}
                            </span>
                            <span className="text-xs font-bold">{toast.msg}</span>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
