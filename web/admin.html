<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">
    <link rel="icon" href="/assets/icons/icon48.png">
    <title>Quản trị hệ thống — AutoPost Pro</title>

    <!-- Legacy iOS Polyfills & Runtime Shims (must load first) -->
    <script src="/ios-polyfill.js"></script>

    <!-- Fonts: Plus Jakarta Sans + JetBrains Mono + Local Material Symbols fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Custom Base Styles & Pre-compiled Legacy-iOS-Safe Tailwind Utilities (includes local Material Symbols woff2) -->
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/tw-legacy.css">

    <!-- React 18.2.0 Production UMD (Zero runtime Babel transpilation) -->
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Firebase v8.10.1 ES5 SDKs (100% compatible with iOS 10-18 Safari) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            height: calc(var(--app-vh, 1vh) * 100);
            height: 100dvh;
        }
        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
            -webkit-user-select: none;
            user-select: none;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        @-webkit-keyframes fadeSlideUp {
            from { opacity: 0; -webkit-transform: translateY(8px); transform: translateY(8px); }
            to { opacity: 1; -webkit-transform: translateY(0); transform: translateY(0); }
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; -webkit-transform: translateY(8px); transform: translateY(8px); }
            to { opacity: 1; -webkit-transform: translateY(0); transform: translateY(0); }
        }
        .animate-enter {
            -webkit-animation: fadeSlideUp 0.2s ease-out;
            animation: fadeSlideUp 0.2s ease-out;
        }
    </style>
</head>
<body class="h-[100dvh] w-full overflow-hidden bg-slate-50 text-slate-900">
    <div id="root" class="w-full h-full"></div>

    <!-- Pre-compiled Admin Dashboard (ES2015 / Safari 11+ compatible) -->
    <script src="/admin.bundle.js"></script>
</body>
</html>
